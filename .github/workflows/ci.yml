name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify application
        run: ./mvnw -B verify

  integration:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Create isolated test configuration
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          path = Path('.env')
          path.write_text('JWT_SECRET=' + secrets.token_hex(48) + '\n'
                          + 'POSTGRES_PASSWORD=' + secrets.token_hex(24) + '\n')
          os.chmod(path, 0o600)
          PY
      - name: Build and start two application instances
        run: docker compose --profile scale up -d --build --wait --wait-timeout 240
      - name: Verify PostgreSQL and Redis across instances
        run: python tests/integration/check_chat.py
      - name: Verify desktop and mobile browsers
        run: python tests/browser/check_browser.py
      - name: Show service status on failure
        if: failure()
        run: docker compose --profile scale ps --all
      - name: Stop test services
        if: always()
        run: docker compose --profile scale down

  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install schema validator
        run: |
          curl --fail --silent --show-error --location --output kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          curl --fail --silent --show-error --location --output CHECKSUMS \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/CHECKSUMS
          awk '$2 == "kubeconform-linux-amd64.tar.gz" { print $1 "  kubeconform.tar.gz" }' CHECKSUMS | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform
      - name: Validate rendered Kubernetes resources
        run: kubectl kustomize deploy/k8s | ./kubeconform -strict -summary -kubernetes-version 1.34.0
