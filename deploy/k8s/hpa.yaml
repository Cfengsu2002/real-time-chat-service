apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relay-chat
  namespace: relay-chat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: relay-chat
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
