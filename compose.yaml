name: relay-chat

services:
  app:
    build: .
    image: realtime-chat:local
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Run ./scripts/init-env.sh first}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-chat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/init-env.sh first}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat}
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/init-env.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks:
      - backend
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks:
      - backend
volumes:
  postgres-data:
  redis-data:
networks:
  frontend:
  backend:
    internal: true
