spring:
  application:
    name: relay-chat
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/relay}
    username: ${DATABASE_USERNAME:relay}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}
