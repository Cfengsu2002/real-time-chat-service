spring:
  application:
    name: relay-chat
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/relay}
    username: ${DATABASE_USERNAME:relay}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
      show-details: never
app:
  realtime:
    transport: ${REALTIME_TRANSPORT:redis}
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}
