spring:
  datasource:
    url: jdbc:h2:mem:relay-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
app:
  jwt:
    secret: relay-test-secret-key-with-at-least-32-bytes
    ttl-seconds: 3600
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
