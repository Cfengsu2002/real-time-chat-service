spring:
  datasource:
    url: jdbc:h2:mem:relay_day1_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
app:
  realtime:
    transport: local
  jwt:
    secret: only-for-isolated-tests-not-a-production-key-123456
    ttl-seconds: 3600
management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
